<div class="system-setting-container">
  <div class="setting-header" nz-row nzJustify="space-between" nzAlign="middle">
    <div nz-col [nzXs]="24" [nzSm]="14" [nzMd]="12">
      <app-search-box buttonName="Search" placeholderName="Search System Settings" />
    </div>
    <div nz-col>
      <button (click)="openModal()" nz-button nzType="primary">Add Setting</button>
    </div>
  </div>
  <nz-table #settings [nzData]="systemSettings()">
    <thead>
      <tr>
        <th>ID</th>
        <th>CategoryName</th>
        <th>Label</th>
        <th>Value</th>
        <th>CreatedAt</th>
        <th>CreatedBy</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (setting of settings.data; track setting.id) {
        <tr>
          <td>{{ setting.id }}</td>
          <td>{{ setting.categoryName }}</td>
          <td>{{ setting.label }}</td>
          <td>{{ setting.value }}</td>
          <td>{{ setting.createdAt }}</td>
          <td>{{ setting.createdBy }}</td>
          <td>
            <div class="btn-group">
              <button (click)="openModal(setting)" nz-button nzType="primary">Edit</button>
              <button
                nz-button
                nzType="primary"
                nzDanger
                nz-popupconfirm
                nzPopconfirmTitle="Are you sure you want to delete this setting?"
                nzonConfirm="deleteSystemSetting(setting.id)"
              >
                Delete
              </button>
            </div>
          </td>
        </tr>
      }
    </tbody>
  </nz-table>
</div>
