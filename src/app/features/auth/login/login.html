<nz-modal
  nzTitle="Welcome Back"
  [nzVisible]="isLoginFormVisible()"
  [nzFooter]="null"
  [nzWidth]="420"
  (nzOnCancel)="handleCancel()"
>
  <ng-container *nzModalContent>
    <div class="login-container">
      <!-- Login Header -->
      <div class="login-header">
        <div class="login-icon">
          <nz-icon nzType="lock" nzTheme="outline" />
        </div>

        <h2>Sign in to your account</h2>

        <p>Enter your details to continue</p>
      </div>

      <!-- Login Form -->
      <form nz-form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <!-- Email -->
        <nz-form-item>
          <nz-form-label nzRequired>UserName</nz-form-label>

          <nz-form-control nzErrorTip="Please enter a valid email address">
            <nz-input-group nzPrefixIcon="username">
              <input nz-input type="text" placeholder="Enter Username" formControlName="username" />
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>

        <!-- Password -->
        <nz-form-item>
          <nz-form-label nzRequired>Password</nz-form-label>

          <nz-form-control nzErrorTip="Password is required">
            <nz-input-group nzPrefixIcon="lock">
              <input
                nz-input
                type="password"
                placeholder="Enter your password"
                formControlName="password"
              />
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>

        <!-- Forgot Password -->
        <div class="form-options">
          <a href=""> Forgot password? </a>
        </div>

        <!-- Login -->
        <button
          nz-button
          nzType="primary"
          nzSize="large"
          nzBlock
          type="submit"
          [disabled]="loginForm.invalid"
        >
          <nz-icon nzType="login"></nz-icon>
          Login
        </button>

        <!-- Register -->
        <div class="register-section">
          <span>Don't have an account?</span>

          <a nz-button nzType="link" (click)="register()"> Register here </a>
        </div>
      </form>
    </div>
  </ng-container>
</nz-modal>
