<div>
  @if (book()) {
    <a [routerLink]="['/book-detail', book()?.id]" class="card-link">
      <nz-card [nzBordered]="false" nzHoverable [nzCover]="coverTemplate" class="book-image-card">
      </nz-card>
    </a>

    <ng-template #coverTemplate>
      <img [src]="book()?.imageUrl" [alt]="book()?.title" class="cover-image" />
      <h2 class="book-title">{{ book()?.title }}</h2>
    </ng-template>
  }
</div>
