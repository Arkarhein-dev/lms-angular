<nz-modal
  [nzVisible]="visible()"
  [nzTitle]="book() ? 'Edit Book' : 'Create Book'"
  [nzFooter]="null"
  nzWidth="650"
  (nzOnCancel)="closeModal()"
>
  <ng-container *nzModalContent>
    <form nz-form [formGroup]="bookForm" (ngSubmit)="onSubmit()">
      <!-- Title -->
      <nz-form-item>
        <nz-form-label nzRequired>Title</nz-form-label>
        <nz-form-control nzErrorTip="Title is required">
          <input type="text" nz-input formControlName="title" placeholder="Enter Book Title" />
        </nz-form-control>
      </nz-form-item>

      <!-- Author -->
      <nz-form-item>
        <nz-form-label nzRequired>Author</nz-form-label>
        <nz-form-control nzErrorTip="Author is required">
          <input type="text" nz-input formControlName="author" placeholder="Enter Author Name" />
        </nz-form-control>
      </nz-form-item>

      <!-- Genre -->
      <nz-form-item>
        <nz-form-label nzRequired>Genre</nz-form-label>
        <nz-form-control nzErrorTip="Genre is required">
          <input type="text" nz-input formControlName="genre" placeholder="Enter genre" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzRequired>Stock Quantity</nz-form-label>
        <nz-form-control nzErrorTip="Stock must be between 0 and 999">
          <input
            type="number"
            nz-input
            formControlName="stock"
            placeholder="Enter Stock Quantity"
            min="0"
            max="999"
          />
        </nz-form-control>
      </nz-form-item>

      <!-- Description -->
      <nz-form-item>
        <nz-form-label nzRequired>Description</nz-form-label>
        <nz-form-control nzErrorTip="Description must be between 20 and 1000 characters">
          <textarea
            nz-input
            formControlName="description"
            rows="4"
            placeholder="Enter Description"
          ></textarea>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzRequired>Cover Image</nz-form-label>
        <nz-form-control
          nzErrorTip="Cover image file is required"
          nzExtra="Supported Formats: PNG, JPG, JPEG, WEBP"
        >
          <nz-upload
            [nzBeforeUpload]="beforeUploadCover"
            [nzFileList]="coverFileList"
            nzAccept="image/png, image/jpeg, image/jpg, image/webp"
          >
            <button nz-button type="button">
              <nz-icon nzType="upload" />
              Select Cover Image
            </button>
          </nz-upload>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzRequired>Pdf File</nz-form-label>
        <nz-form-control
          nzErrorTip="Pdf File is required"
          nzExtra="Supported Format : pdf (Max: 50MB)"
        >
          <nz-upload
            [nzBeforeUpload]="beforeUploadPdf"
            [nzFileList]="pdfFileList"
            nzAccept="application/pdf"
          >
            <button nz-button type="button">
              <nz-icon nzType="upload"></nz-icon>
              Select Pdf File
            </button>
          </nz-upload>
        </nz-form-control>
      </nz-form-item>

      <div class="form-actions">
        <button nz-button nzType="primary" type="submit" [nzLoading]="isSubmitting()">
          {{ book() ? 'Update Book' : 'Create Book' }}
        </button>
      </div>
    </form>
  </ng-container>
</nz-modal>
