<div class="borrow-book-card">
  <nz-card nzHoverable>
    <img nz-card-cover [src]="borrowBook().bookImage" [alt]="borrowBook().bookTitle" />
    <nz-card-meta [nzTitle]="borrowBook().bookTitle" nzDescription="Brand new day bla bla" />

    <div class="borrow-info">
      <div class="status-section">
        @switch (borrowBook().BorrowStatus) {
          @case ('BORROWED') {
            <nz-tag nzColor="blue">Borrowed</nz-tag>
          }
          @case ('OVERDUE') {
            <nz-tag nzColor="red">OverDue</nz-tag>
          }
          @case ('RETURNED') {
            <nz-tag nzColor="green">Returned</nz-tag>
          }
        }
      </div>

      <div class="date-info">
        <div class="date-item">
          <span class="label">Borrowed Date</span>
          <span class="date">
            {{ borrowBook().borrowDate }}
          </span>
        </div>

        <div class="date-item">
          <span class="label">Due Date</span>
          <span class="date">
            {{ borrowBook().dueDate }}
          </span>
        </div>

        <div class="date-item">
          <span class="label">Return Date</span>
          <span class="date">
            {{ borrowBook().returnDate }}
          </span>
        </div>
      </div>
    </div>

    <div class="button-group">
      <button nz-button nzType="primary" [routerLink]="['/read-online', borrowBook().bookId]">
        Read Online
      </button>
      <button nz-button nzType="link" nzDanger (click)="onReturnBook()">Return Book</button>
    </div>
  </nz-card>
</div>
